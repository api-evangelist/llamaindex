  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://developers.llamaindex.ai/python/framework/
  properties:
  - url: https://developers.llamaindex.ai/python/framework/
    type: Documentation
  description: >-
    LlamaIndex is an open-source Python framework for building LLM-powered applications including agents,
    RAG pipelines, and custom workflows. It provides data connectors for ingesting data from various sources
    such as APIs, PDFs, databases, and more. The framework offers high-level abstractions like query engines,
    chat engines, and agent classes (FunctionAgent, ReActAgent, CodeActAgent), as well as lower-level
    APIs for advanced customization.
- aid: llamaindex:typescript-framework
  name: LlamaIndex TypeScript Framework
  tags:
  - Agents
  - Framework
  - JavaScript
  - LLM
  - Open-Source
  - RAG
  - SDK
  - TypeScript
  tags_raw:
  - Agents
  - Framework
  - JavaScript
  - LLM
  - Open Source
  - RAG
  - SDK
  - TypeScript
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://developers.llamaindex.ai/typescript/framework/
  properties:
  - url: https://developers.llamaindex.ai/typescript/framework/
    type: Documentation
  description: >-
    LlamaIndex TypeScript is the JavaScript and TypeScript implementation of the LlamaIndex framework
    for building LLM-powered applications. It provides server-side TypeScript support for building agents,
    RAG pipelines, and agentic workflows with the same core abstractions as the Python framework. The
    library supports integration with LlamaCloud services and offers convenient access to cloud APIs for
    document parsing, extraction, and indexing from Node.js environments.
