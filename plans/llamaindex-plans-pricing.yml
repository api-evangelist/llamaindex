description: LlamaIndex (LlamaCloud / LlamaParse) prices via tiered subscriptions with included
  monthly credits and pay-as-you-go top-ups. Credits map to per-page parsing cost (1,000 credits = $1.25).
  Auto Mode routes pages between basic and agentic tiers to lower cost. Enterprise is contract-based with
  5x rate limits and SSO/VPC options.
