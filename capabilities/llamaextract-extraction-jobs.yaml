      - name: createextractionjob
        method: POST
        description: Create an extraction job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: extraction-jobs-jobId
      path: /extraction/jobs/{jobId}
      operations:
      - name: getextractionjob
