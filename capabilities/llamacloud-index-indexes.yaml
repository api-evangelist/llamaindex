naftiko: 1.0.0-alpha2
info:
  label: LlamaIndex LlamaCloud Index API — Indexes
  description: 'LlamaIndex LlamaCloud Index API — Indexes. 5 operations. Lead operation: List indexes. Self-contained Naftiko
    capability covering one Llamaindex business surface.'
  tags:
  - Llamaindex
  - Indexes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LLAMAINDEX_API_KEY: LLAMAINDEX_API_KEY
capability:
  consumes:
  - type: http
    namespace: llamacloud-index-indexes
    baseUri: https://api.cloud.llamaindex.ai/api/v1
    description: LlamaIndex LlamaCloud Index API — Indexes business capability. Self-contained, no shared references.
    resources:
    - name: pipelines
      path: /pipelines
      operations:
      - name: listindexes
        method: GET
        description: List indexes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: project_id
          in: query
          type: string
          description: Filter indexes by project identifier.
          required: true
      - name: createindex
        method: POST
        description: Create an index
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: pipelines-pipelineId
      path: /pipelines/{pipelineId}
      operations:
      - name: getindex
        method: GET
        description: Get an index
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deleteindex
        method: DELETE
        description: Delete an index
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: pipelines-pipelineId-sync
      path: /pipelines/{pipelineId}/sync
      operations:
      - name: syncindex
        method: POST
        description: Sync an index
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.LLAMAINDEX_API_KEY}}'
  exposes:
  - type: rest
    namespace: llamacloud-index-indexes-rest
    port: 8080
    description: REST adapter for LlamaIndex LlamaCloud Index API — Indexes. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/pipelines
      name: pipelines
      description: REST surface for pipelines.
      operations:
      - method: GET
        name: listindexes
        description: List indexes
        call: llamacloud-index-indexes.listindexes
        with:
          project_id: rest.project_id
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createindex
        description: Create an index
        call: llamacloud-index-indexes.createindex
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/pipelines/{pipelineid}
      name: pipelines-pipelineid
      description: REST surface for pipelines-pipelineId.
      operations:
      - method: GET
        name: getindex
        description: Get an index
        call: llamacloud-index-indexes.getindex
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteindex
        description: Delete an index
        call: llamacloud-index-indexes.deleteindex
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/pipelines/{pipelineid}/sync
      name: pipelines-pipelineid-sync
      description: REST surface for pipelines-pipelineId-sync.
      operations:
      - method: POST
        name: syncindex
        description: Sync an index
        call: llamacloud-index-indexes.syncindex
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: llamacloud-index-indexes-mcp
    port: 9090
    transport: http
    description: MCP adapter for LlamaIndex LlamaCloud Index API — Indexes. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-indexes
      description: List indexes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: llamacloud-index-indexes.listindexes
      with:
        project_id: tools.project_id
      outputParameters:
      - type: object
        mapping: $.
    - name: create-index
      description: Create an index
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: llamacloud-index-indexes.createindex
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-index
      description: Get an index
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: llamacloud-index-indexes.getindex
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-index
      description: Delete an index
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: llamacloud-index-indexes.deleteindex
      outputParameters:
      - type: object
        mapping: $.
    - name: sync-index
      description: Sync an index
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: llamacloud-index-indexes.syncindex
      outputParameters:
      - type: object
        mapping: $.
