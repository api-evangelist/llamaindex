      name: pipelines-pipelineid-jobs
      description: REST surface for pipelines-pipelineId-jobs.
      operations:
      - method: GET
        name: listpipelinejobs
        description: List pipeline jobs
        call: llamacloud-pipeline-jobs.listpipelinejobs
        outputParameters:
        - type: object
          mapping: $.
