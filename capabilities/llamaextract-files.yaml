naftiko: 1.0.0-alpha2
info:
  label: LlamaIndex LlamaExtract API — Files
  description: 'LlamaIndex LlamaExtract API — Files. 1 operations. Lead operation: Upload a file. Self-contained Naftiko capability
    covering one Llamaindex business surface.'
  tags:
  - Llamaindex
  - Files
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LLAMAINDEX_API_KEY: LLAMAINDEX_API_KEY
capability:
  consumes:
  - type: http
    namespace: llamaextract-files
    baseUri: https://api.cloud.llamaindex.ai/api/v1
    description: LlamaIndex LlamaExtract API — Files business capability. Self-contained, no shared references.
    resources:
    - name: files
      path: /files
      operations:
      - name: uploadfile
        method: POST
        description: Upload a file
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: project_id
          in: query
          type: string
          description: The project to associate the file with.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.LLAMAINDEX_API_KEY}}'
  exposes:
  - type: rest
    namespace: llamaextract-files-rest
    port: 8080
    description: REST adapter for LlamaIndex LlamaExtract API — Files. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/files
      name: files
      description: REST surface for files.
      operations:
      - method: POST
        name: uploadfile
        description: Upload a file
        call: llamaextract-files.uploadfile
        with:
          project_id: rest.project_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: llamaextract-files-mcp
    port: 9090
    transport: http
    description: MCP adapter for LlamaIndex LlamaExtract API — Files. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: upload-file
      description: Upload a file
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: llamaextract-files.uploadfile
      with:
        project_id: tools.project_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
